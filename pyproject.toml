[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resumake-latex-cv"
version = "0.1.0"
description = "Generate compact, ATS-friendly Resumake-style LaTeX CVs from JSON."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
resumake-cv = "resumake_cv.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.package-data]
resumake_cv = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
